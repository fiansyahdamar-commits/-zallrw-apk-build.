name: Build Zall RW APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f source/Zall_RW_src_patched.zip || {
            echo "::error::Missing source/Zall_RW_src_patched.zip. Add the original Zall RW Apktool source archive first."
            exit 1
          }
          unzip -t source/Zall_RW_src_patched.zip

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip zip openjdk-17-jdk

      - name: Extract source
        run: |
          mkdir -p work
          unzip -q source/Zall_RW_src_patched.zip -d work
          MANIFEST="$(find work -name AndroidManifest.xml -type f -print -quit)"
          test -n "$MANIFEST"
          echo "PROJECT_DIR=$(dirname "$MANIFEST")" >> "$GITHUB_ENV"

      - name: Build unsigned APK
        run: |
          set -euo pipefail
          apktool b "$PROJECT_DIR" -f -o "$GITHUB_WORKSPACE/ZallRW-unsigned.apk"
          test -s "$GITHUB_WORKSPACE/ZallRW-unsigned.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-UNSIGNED
          path: ZallRW-unsigned.apk
          if-no-files-found: error
          retention-days: 7
