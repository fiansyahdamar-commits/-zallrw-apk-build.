name: Build Zall RW APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source.part-*"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 18); do test -s "source.part-${i}"; done
          cat $(printf 'source.part-%02d ' $(seq 0 18)) > Zall_RW_src_patched.zip
          unzip -tq Zall_RW_src_patched.zip
          mkdir work
          unzip -q Zall_RW_src_patched.zip -d work
      - name: Diagnose metadata needed for safe rebuild
        shell: bash
        run: |
          set -euo pipefail
          cd "work/Zall RW_src"
          echo "=== apktool.json ==="
          cat apktool.json
          echo
          echo "=== project directories ==="
          find . -maxdepth 2 -type d | sort | head -120
          echo "=== original directory ==="
          find original -maxdepth 2 -type f -printf '%p (%s bytes)\n' | head -80
          echo "=== resources and smali counts ==="
          find res -type f | wc -l
          find smali smali_classes2 -type f -name '*.smali' | wc -l
          echo "=== metadata files ==="
          find .. -maxdepth 3 -type f \( -name 'apktool.yml' -o -name 'apktool.yaml' -o -name 'apktool.json' \) -print
          echo "Diagnostic completed. No APK is produced in this inspection run."
