name: Build Zall RW APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source.part-*"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and check source archive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 18); do
            part="source.part-${i}"
            test -s "$part" || {
              echo "::error::Missing source archive part: $part"
              exit 1
            }
          done
          cat $(printf 'source.part-%02d ' $(seq 0 18)) > Zall_RW_src_patched.zip
          unzip -tq Zall_RW_src_patched.zip
          echo "Source archive assembled and ZIP integrity passed."

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip zip openjdk-17-jdk

      - name: Extract source
        run: |
          mkdir -p work
          unzip -q Zall_RW_src_patched.zip -d work
          MANIFEST="$(find work -name AndroidManifest.xml -type f -print -quit)"
          test -n "$MANIFEST"
          echo "PROJECT_DIR=$(dirname "$MANIFEST")" >> "$GITHUB_ENV"

      - name: Build unsigned APK
        run: |
          set -euo pipefail
          apktool b "$PROJECT_DIR" -f -o "$GITHUB_WORKSPACE/ZallRW-unsigned.apk"
          test -s "$GITHUB_WORKSPACE/ZallRW-unsigned.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-UNSIGNED
          path: ZallRW-unsigned.apk
          if-no-files-found: error
          retention-days: 7
