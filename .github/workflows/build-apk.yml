name: Build Zall RW APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source.part-*"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  rebuild-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl unzip python3-yaml

      - name: Install modern Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" -o /usr/local/bin/apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 18); do test -s "source.part-${i}"; done
          cat $(printf 'source.part-%02d ' $(seq 0 18)) > Zall_RW_src_patched.zip
          unzip -tq Zall_RW_src_patched.zip
          mkdir work
          unzip -q Zall_RW_src_patched.zip -d work

      - name: Normalize decompiled source and rebuild
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Xmx10g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          cd "work/Zall RW_src"
          echo "=== runner memory ==="
          free -h
          echo "=== Apktool ==="
          apktool --version

          echo "=== remove non-Smali section labels emitted by the decompiler ==="
          find smali smali_classes* -type f -name '*.smali' -print0 | \
            xargs -0 sed -i -E '/^(interfaces|virtual methods|direct methods|static fields|instance fields|direct fields|virtual fields)[[:space:]]*$/d'

          echo "=== fix adaptive icon resource qualifier ==="
          if [ -d res/mipmap-anydpi ]; then
            mkdir -p res/mipmap-anydpi-v26
            find res/mipmap-anydpi -maxdepth 1 -type f -exec mv -t res/mipmap-anydpi-v26 {} +
            rmdir res/mipmap-anydpi
          fi

          echo "=== verify known malformed Smali headings are gone ==="
          if grep -R -n -E '^(interfaces|virtual methods|direct methods|static fields|instance fields|direct fields|virtual fields)[[:space:]]*$' smali smali_classes* --include='*.smali'; then
            echo "Unexpected decompiler labels remain"
            exit 1
          fi

          echo "=== patch redeem password request without changing backend or app state ==="
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          request_file = root / "smali_classes2/z/du0.smali"
          ui_file = root / "smali/z/b4.smali"
          s = request_file.read_text()

          old_url = "https://zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app/api/redeem"
          new_url = "https://nvxgpmbakbzjyfjstdwl.supabase.co/functions/v1/admin-api-v2/redeem"
          assert s.count(old_url) == 1, "Expected exactly one old redeem endpoint"
          s = s.replace(old_url, new_url, 1)

          parse_anchor = '    iget-object v11, v0, Lz/du0;->j:Ljava/lang/String;\n'
          assert s.count(parse_anchor) == 1, "Could not locate redeem input register"

          # Reserve v16-v19 in this method. Increasing .locals preserves all existing v-registers.
          method_start = s.rfind(".method", 0, s.index(parse_anchor))
          method_end = s.index(".end method", method_start)
          method = s[method_start:method_end]
          import re
          locals_match = re.search(r"(?m)^(\s*)\.locals\s+(\d+)\s*$", method)
          if locals_match:
              current = int(locals_match.group(2))
              method = method[:locals_match.start(2)] + str(max(current, 20)) + method[locals_match.end(2):]
          else:
              regs_match = re.search(r"(?m)^(\s*)\.registers\s+(\d+)\s*$", method)
              assert regs_match, "Redeem method has no .locals or .registers directive"
              current = int(regs_match.group(2))
              # The constructor/coroutine method has at most 8 parameter words; reserve 20 locals.
              method = method[:regs_match.start(2)] + str(max(current, 28)) + method[regs_match.end(2):]
          s = s[:method_start] + method + s[method_end:]

          parse_block = '''    iget-object v11, v0, Lz/du0;->j:Ljava/lang/String;
              # Parse CODE|PASSWORD with contiguous range registers.
              move-object/from16 v17, v11
              move-object/from16 v18, v17
              const-string v19, "|"
              invoke-virtual/range {v18 .. v19}, Ljava/lang/String;->indexOf(Ljava/lang/String;)I
              move-result v18
              if-ltz v18, :no_redeem_password
              move/from16 v19, v18
              const/16 v18, 0x0
              invoke-virtual/range {v17 .. v19}, Ljava/lang/String;->substring(II)Ljava/lang/String;
              move-result-object v11
              add-int/lit8 v19, v19, 0x1
              move/from16 v18, v19
              invoke-virtual/range {v17 .. v18}, Ljava/lang/String;->substring(I)Ljava/lang/String;
              move-result-object v16
              goto :redeem_password_parsed
          :no_redeem_password
              const-string v16, ""
          :redeem_password_parsed
          '''
          s = s.replace(parse_anchor, parse_block, 1)

          first_put = '    invoke-virtual {v12, v10, v3}, Lorg/json/JSONObject;->put(Ljava/lang/String;Ljava/lang/Object;)Lorg/json/JSONObject;\n'
          first_add = first_put + '''    move-object/from16 v14, v16
              const-string v15, "password"
              invoke-virtual {v12, v15, v14}, Lorg/json/JSONObject;->put(Ljava/lang/String;Ljava/lang/Object;)Lorg/json/JSONObject;
          '''
          assert s.count(first_put) == 1, "Initial JSON code field not found uniquely"
          s = s.replace(first_put, first_add, 1)

          retry_put = '    invoke-virtual {v2, v10, v3}, Lorg/json/JSONObject;->put(Ljava/lang/String;Ljava/lang/Object;)Lorg/json/JSONObject;\n'
          retry_add = retry_put + '''    move-object/from16 v14, v16
              const-string v15, "password"
              invoke-virtual {v2, v15, v14}, Lorg/json/JSONObject;->put(Ljava/lang/String;Ljava/lang/Object;)Lorg/json/JSONObject;
          '''
          assert s.count(retry_put) == 1, "Retry JSON code field not found uniquely"
          s = s.replace(retry_put, retry_add, 1)
          assert s.count(new_url) == 1 and s.count('"password"') == 2
          request_file.write_text(s)

          ui = ui_file.read_text()
          old_help = "Enter your VIP activation code below to upgrade your account instantly."
          new_help = "Enter code and password separated by | (CODE|PASSWORD)."
          assert ui.count(old_help) == 1, "Redeem helper text not found uniquely"
          ui_file.write_text(ui.replace(old_help, new_help, 1))

          # Ensure Android extracts bundled native libraries during installation.
          manifest_file = root / "AndroidManifest.xml"
          manifest = manifest_file.read_text()
          import re
          # Android 14+ rejects APKs without a declared target SDK.
          uses_sdk = re.search(r"<uses-sdk\b[^>]*/?>", manifest)
          if uses_sdk:
              sdk_tag = uses_sdk.group(0)
              if re.search(r'android:targetSdkVersion="[^"]*"', sdk_tag):
                  sdk_tag = re.sub(r'android:targetSdkVersion="[^"]*"', 'android:targetSdkVersion="28"', sdk_tag)
              else:
                  sdk_tag = sdk_tag[:-1] + ' android:targetSdkVersion="28"' + ('>' if sdk_tag.endswith('>') else '')
              manifest = manifest[:uses_sdk.start()] + sdk_tag + manifest[uses_sdk.end():]
          else:
              manifest_match = re.search(r"<manifest\b[^>]*>", manifest)
              assert manifest_match, "Android manifest root element not found"
              manifest = manifest[:manifest_match.end()] + '\n    <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="28" />' + manifest[manifest_match.end():]
          app_match = re.search(r"<application\b[^>]*", manifest)
          assert app_match, "Android application manifest element not found"
          app_tag = app_match.group(0)
          if "android:extractNativeLibs=" in app_tag:
              app_tag = re.sub(r'android:extractNativeLibs="[^"]*"', 'android:extractNativeLibs="true"', app_tag)
          else:
              app_tag = app_tag[:-1] + ' android:extractNativeLibs="true"'
          manifest = manifest[:app_match.start()] + app_tag + manifest[app_match.end():]
          manifest_file.write_text(manifest)
          print("NATIVE_LIBRARY_EXTRACTION=true")
          print("ANDROID_TARGET_SDK=28")

          print("REDEEM_PASSWORD_PATCH=PASS")
          PY
          grep -q 'functions/v1/admin-api-v2/redeem' "smali_classes2/z/du0.smali"
          test "$(grep -c '"password"' "smali_classes2/z/du0.smali")" -eq 2
          grep -q 'CODE|PASSWORD' "smali/z/b4.smali"

          echo "=== metadata conversion ==="
          python3 - <<'PY'
          import json, yaml
          from pathlib import Path
          src = json.loads(Path("apktool.json").read_text())
          pkg = src.get("PackageInfo", {})
          vi = src.get("VersionInfo", {})
          fw = src.get("UsesFramework", {})
          data = {
              "version": "2.9.3",
              "apkFileName": src.get("apkFileName", "Zall RW_src.apk"),
              "isFrameworkApk": False,
              "usesFramework": {"ids": fw.get("ids", [1])},
              "packageInfo": {
                  "forcedPackageId": str(int(pkg.get("forcedPackageId", "127"))),
                  "renameManifestPackage": pkg.get("renameManifestPackage")
              },
              "versionInfo": {
                  "versionCode": str(vi.get("versionCode", "19")),
                  "versionName": str(vi.get("versionName", "5.5"))
              },
              "sharedLibrary": bool(src.get("sharedLibrary", False)),
              "sparseResources": bool(src.get("sparseResources", False)),
              "unknownFiles": src.get("unknownFiles", {}),
              "doNotCompress": src.get("doNotCompress", [])
          }
          Path("apktool.yml").write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True))
          print("apktool.yml generated with decimal package ID")
          PY

          apktool b . -o ../ZallRW-rebuild-test-unsigned.apk
          test -s ../ZallRW-rebuild-test-unsigned.apk
          unzip -tq ../ZallRW-rebuild-test-unsigned.apk
          echo "APKTOOL_BUILD=PASS" | tee ../build-result.txt
          ls -lh ../ZallRW-rebuild-test-unsigned.apk

      - name: Sign isolated test APK and verify signature
        shell: bash
        run: |
          set -euo pipefail
          cd work
          # This throwaway key is for isolated testing only; it is not the legacy release key.
          TEST_STORE_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore zallrw-test-only.jks \
            -storepass "$TEST_STORE_PASS" \
            -keypass "$TEST_STORE_PASS" \
            -alias zallrw-test-only \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Zall RW Test Only, OU=QA, O=Zall RW, C=ID" >/dev/null 2>&1
          zipalign -f 4 ZallRW-rebuild-test-unsigned.apk ZallRW-test-aligned.apk
          apksigner sign \
            --ks zallrw-test-only.jks \
            --ks-key-alias zallrw-test-only \
            --ks-pass "pass:$TEST_STORE_PASS" \
            --key-pass "pass:$TEST_STORE_PASS" \
            --out ZallRW-TEST-ONLY.apk ZallRW-test-aligned.apk
          apksigner verify --verbose --print-certs ZallRW-TEST-ONLY.apk | tee signing-result.txt
          grep -q "Verifies" signing-result.txt
          echo "TEST_APK_SIGNATURE=PASS" >> build-result.txt
          rm -f zallrw-test-only.jks ZallRW-test-aligned.apk
          ls -lh ZallRW-TEST-ONLY.apk


      - name: Smoke-test signed APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install work/ZallRW-TEST-ONLY.apk
            adb shell monkey -p com.zallrwv4.app 1
            sleep 25
            adb shell pidof com.zallrwv4.app > work/app-pid.txt || true
            if test ! -s work/app-pid.txt; then
              echo "EMULATOR_STARTUP=FAIL" | tee work/emulator-result.txt
              adb logcat -d -t 2500 > work/startup-logcat.txt
              exit 1
            fi
            echo "EMULATOR_STARTUP=PASS" | tee work/emulator-result.txt
            adb logcat -d -t 2500 > work/startup-logcat.txt


      - name: Upload rebuild test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-REBUILD-TEST-DIAGNOSTICS
          path: |
            work/build-result.txt
            work/ZallRW-rebuild-test-unsigned.apk
            work/ZallRW-TEST-ONLY.apk
            work/signing-result.txt
            work/emulator-result.txt
            work/startup-logcat.txt
          if-no-files-found: warn
          retention-days: 7
