name: Build Zall RW APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source.part-*"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  rebuild-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl unzip python3-yaml

      - name: Install modern Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" -o /usr/local/bin/apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 18); do test -s "source.part-${i}"; done
          cat $(printf 'source.part-%02d ' $(seq 0 18)) > Zall_RW_src_patched.zip
          unzip -tq Zall_RW_src_patched.zip
          mkdir work
          unzip -q Zall_RW_src_patched.zip -d work

      - name: Capture existing app theme and UI source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/theme-diagnostics
          find "work/Zall RW_src" -type f \\( -name '*.smali' -o -name '*.xml' \\) | grep -E 'Theme|Color|NavBar|NavGraph|HomeScreen|SettingsScreen|ProfileScreen' > work/theme-diagnostics/ui-files.txt || true
          grep -R -n -E 'ZallRWV4Theme|ProgramRed|0xFF[0-9A-Fa-f]{6}|ColorScheme|darkColorScheme|lightColorScheme' "work/Zall RW_src"/smali* --include='*.smali' > work/theme-diagnostics/theme-color-references.txt || true
          while IFS= read -r file; do
            case "$file" in
              *Theme*|*NavBar*|*NavGraph*|*HomeScreen*|*SettingsScreen*|*ProfileScreen*)
                mkdir -p "work/theme-diagnostics/$(dirname "$file" | sed 's#work/Zall RW_src/##')"
                cp "$file" "work/theme-diagnostics/$(dirname "$file" | sed 's#work/Zall RW_src/##')/" ;;
            esac
          done < work/theme-diagnostics/ui-files.txt
          tar -czf work/theme-diagnostics.tar.gz -C work theme-diagnostics

      - name: Upload theme source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-THEME-SOURCE-DIAGNOSTICS
          path: work/theme-diagnostics.tar.gz
          retention-days: 7

      - name: Prepare permanent release signing key and fingerprint
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd work
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > zallrw-release.jks
          test -s zallrw-release.jks
          keytool -exportcert -rfc -keystore zallrw-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            -file zallrw-release-cert.pem >/dev/null 2>&1
          openssl x509 -in zallrw-release-cert.pem -outform DER -out zallrw-release-cert.der
          RELEASE_CERT_SHA_B64="$(openssl dgst -sha256 -binary zallrw-release-cert.der | base64 -w0)"
          test -n "$RELEASE_CERT_SHA_B64"
          echo "RELEASE_CERT_SHA_B64=$RELEASE_CERT_SHA_B64" >> "$GITHUB_ENV"
          echo "Permanent release signing certificate prepared."

      - name: Normalize decompiled source and rebuild
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Xmx10g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          cd "work/Zall RW_src"
          echo "=== runner memory ==="
          free -h
          echo "=== Apktool ==="
          apktool --version

          echo "=== remove non-Smali section labels emitted by the decompiler ==="
          find smali smali_classes* -type f -name '*.smali' -print0 | \
            xargs -0 sed -i -E '/^(interfaces|virtual methods|direct methods|static fields|instance fields|direct fields|virtual fields)[[:space:]]*$/d'

          echo "=== fix adaptive icon resource qualifier ==="
          if [ -d res/mipmap-anydpi ]; then
            mkdir -p res/mipmap-anydpi-v26
            find res/mipmap-anydpi -maxdepth 1 -type f -exec mv -t res/mipmap-anydpi-v26 {} +
            rmdir res/mipmap-anydpi
          fi

          echo "=== verify known malformed Smali headings are gone ==="
          if grep -R -n -E '^(interfaces|virtual methods|direct methods|static fields|instance fields|direct fields|virtual fields)[[:space:]]*$' smali smali_classes* --include='*.smali'; then
            echo "Unexpected decompiler labels remain"
            exit 1
          fi

          echo "=== patch redeem password request without changing backend or app state ==="
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(".")
          request_file = root / "smali_classes2/z/du0.smali"
          ui_file = root / "smali/z/b4.smali"
          s = request_file.read_text()

          old_url = "https://zallrw-vip-backend-63rdvpmns-kedu065-maker.vercel.app/api/redeem"
          new_url = "https://nvxgpmbakbzjyfjstdwl.supabase.co/functions/v1/admin-api-v2/redeem"
          assert s.count(old_url) == 1, "Expected exactly one old redeem endpoint"
          s = s.replace(old_url, new_url, 1)

          parse_anchor = '    iget-object v11, v0, Lz/du0;->j:Ljava/lang/String;\n'
          assert s.count(parse_anchor) == 1, "Could not locate redeem input register"
          # Leave the original code value intact. No password parsing or password JSON field.
          request_file.write_text(s)

          ui = ui_file.read_text()
          old_help = "Enter your VIP activation code below to upgrade your account instantly."
          new_help = "Enter your VIP activation code below to upgrade your account instantly."
          assert ui.count(old_help) == 1, "Redeem helper text not found uniquely"
          ui_file.write_text(ui.replace(old_help, new_help, 1))

          # The app validates its own signing certificate at startup. Bind the release
          # test APK to this run's temporary signer without changing the source archive.
          expected_pin = "NzXW8cqbFRP2WXcG9sOywgAsFT+AISDgqH5gDne81JY="
          test_pin = os.environ.get("RELEASE_CERT_SHA_B64", "")
          assert test_pin, "Temporary test signer fingerprint was not prepared"
          matches = []
          for candidate in root.rglob("*.smali"):
              try:
                  content = candidate.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              count = content.count(expected_pin)
              if count:
                  matches.append((candidate, content, count))
          total_matches = sum(count for _, _, count in matches)
          assert len(matches) == 1 and total_matches == 2, (
              "Expected the original signing fingerprint twice in one Smali class; "
              f"found {[(str(p), n) for p, _, n in matches]}"
          )
          integrity_file, integrity, _ = matches[0]
          integrity_file.write_text(integrity.replace(expected_pin, test_pin))
          print(f"RELEASE_SIGNING_FINGERPRINT_PATCH=PASS file={integrity_file} occurrences={total_matches}")

          # Ensure Android extracts bundled native libraries during installation.
          manifest_file = root / "AndroidManifest.xml"
          manifest = manifest_file.read_text()
          import re
          # Android 14+ rejects APKs without a declared target SDK.
          uses_sdk = re.search(r"<uses-sdk\b[^>]*/?>", manifest)
          if uses_sdk:
              sdk_tag = uses_sdk.group(0)
              if re.search(r'android:targetSdkVersion="[^"]*"', sdk_tag):
                  sdk_tag = re.sub(r'android:targetSdkVersion="[^"]*"', 'android:targetSdkVersion="28"', sdk_tag)
              else:
                  sdk_tag = sdk_tag[:-1] + ' android:targetSdkVersion="28"' + ('>' if sdk_tag.endswith('>') else '')
              manifest = manifest[:uses_sdk.start()] + sdk_tag + manifest[uses_sdk.end():]
          else:
              manifest_match = re.search(r"<manifest\b[^>]*>", manifest)
              assert manifest_match, "Android manifest root element not found"
              manifest = manifest[:manifest_match.end()] + '\n    <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="28" />' + manifest[manifest_match.end():]
          app_match = re.search(r"<application\b[^>]*", manifest)
          assert app_match, "Android application manifest element not found"
          app_tag = app_match.group(0)
          if "android:extractNativeLibs=" in app_tag:
              app_tag = re.sub(r'android:extractNativeLibs="[^"]*"', 'android:extractNativeLibs="true"', app_tag)
          else:
              app_tag = app_tag[:-1] + ' android:extractNativeLibs="true"'
          manifest = manifest[:app_match.start()] + app_tag + manifest[app_match.end():]
          manifest_file.write_text(manifest)
          print("NATIVE_LIBRARY_EXTRACTION=true")
          print("ANDROID_TARGET_SDK=28")

          print("REDEEM_PASSWORD_PATCH=PASS")
          PY
          grep -q 'functions/v1/admin-api-v2/redeem' "smali_classes2/z/du0.smali"
          ! grep -q 'CODE|PASSWORD' "smali/z/b4.smali"

          echo "=== metadata conversion ==="
          python3 - <<'PY'
          import json, yaml
          from pathlib import Path
          src = json.loads(Path("apktool.json").read_text())
          pkg = src.get("PackageInfo", {})
          vi = src.get("VersionInfo", {})
          fw = src.get("UsesFramework", {})
          data = {
              "version": "2.9.3",
              "apkFileName": src.get("apkFileName", "Zall RW_src.apk"),
              "isFrameworkApk": False,
              "usesFramework": {"ids": fw.get("ids", [1])},
              "packageInfo": {
                  "forcedPackageId": str(int(pkg.get("forcedPackageId", "127"))),
                  "renameManifestPackage": pkg.get("renameManifestPackage")
              },
              "versionInfo": {
                  "versionCode": str(vi.get("versionCode", "19")),
                  "versionName": str(vi.get("versionName", "5.5"))
              },
              "sharedLibrary": bool(src.get("sharedLibrary", False)),
              "sparseResources": bool(src.get("sparseResources", False)),
              "unknownFiles": src.get("unknownFiles", {}),
              "doNotCompress": src.get("doNotCompress", [])
          }
          Path("apktool.yml").write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True))
          print("apktool.yml generated with decimal package ID")
          PY

          apktool b . --api-level 30 -o ../ZallRW-permanent-unsigned.apk
          echo "=== rebuilt DEX format ==="
          unzip -p ../ZallRW-permanent-unsigned.apk classes.dex | head -c 8 | od -An -tc

          # Apktool preserves coroutine Android classes but drops META-INF service
          # descriptors. Without this provider, Dispatchers.Main fails at startup.
          mkdir -p ../coroutines-service/META-INF/services
          printf '%s\n' 'kotlinx.coroutines.android.AndroidDispatcherFactory' > ../coroutines-service/META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory
          (cd ../coroutines-service && zip -q -r ../ZallRW-permanent-unsigned.apk META-INF)
          unzip -p ../ZallRW-permanent-unsigned.apk META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory | grep -Fx 'kotlinx.coroutines.android.AndroidDispatcherFactory'
          echo "COROUTINES_ANDROID_SERVICE_PROVIDER=PASS"

          test -s ../ZallRW-permanent-unsigned.apk
          unzip -tq ../ZallRW-permanent-unsigned.apk
          echo "APKTOOL_BUILD=PASS" | tee ../build-result.txt
          ls -lh ../ZallRW-permanent-unsigned.apk

      - name: Inspect Compose DrawScope ABI in original Smali
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "work/Zall RW_src"
          mkdir -p ../compose-diagnostics
          OUT="../compose-diagnostics/compose-abi.txt"
          {
            echo "=== DrawScope class definition ==="
            grep -R -n -B 3 -A 8 '^\.class .*Landroidx/compose/ui/graphics/drawscope/DrawScope;' smali* --include='*.smali' || true
            echo "=== DrawScope drawRect declarations and invocations ==="
            grep -R -n -B 8 -A 10 'drawRect-n-J9OG0' smali* --include='*.smali' || true
            echo "=== BackgroundNode class and draw implementation ==="
            grep -R -l 'BackgroundNode' smali* --include='*.smali' | while read -r f; do
              echo "--- $f ---"
              grep -n -B 8 -A 14 -E '^\.class|drawRect-n-J9OG0|DrawScope;->' "$f" || true
            done
            echo "=== duplicate DrawScope class definitions ==="
            grep -R -l '^\.class .*Landroidx/compose/ui/graphics/drawscope/DrawScope;' smali* --include='*.smali' || true
          } > "$OUT"
          cat "$OUT"

      - name: Upload Compose ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-COMPOSE-ABI-DIAGNOSTICS
          path: work/compose-diagnostics/compose-abi.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Sign permanent APK and verify signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd work
          test -s zallrw-release.jks
          zipalign -f 4 ZallRW-permanent-unsigned.apk ZallRW-permanent-aligned.apk
          apksigner sign \
            --ks zallrw-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out ZallRW-PERMANENT.apk ZallRW-permanent-aligned.apk
          apksigner verify --verbose --print-certs ZallRW-PERMANENT.apk | tee signing-result.txt
          grep -q "Verifies" signing-result.txt
          actual_pin="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signing-result.txt | head -1 | tr 'A-F' 'a-f')"
          expected_pin="$(openssl dgst -sha256 -binary zallrw-release-cert.der | xxd -p -c 256)"
          test -n "$actual_pin" && test "$actual_pin" = "$expected_pin"
          echo "PERMANENT_APK_SIGNATURE=PASS" >> build-result.txt
          rm -f zallrw-release.jks zallrw-release-cert.pem zallrw-release-cert.der ZallRW-permanent-aligned.apk
          ls -lh ZallRW-PERMANENT.apk


      - name: Prepare emulator smoke-test script
        shell: bash
        run: |
          mkdir -p work
          cat > work/smoke-test.sh <<'SMOKE'
          #!/usr/bin/env bash
          set +e
          mkdir -p work
          adb install work/ZallRW-PERMANENT.apk
          install_rc=$?
          if [ "$install_rc" -ne 0 ]; then
            echo "APK_INSTALL_FAILED=$install_rc" > work/emulator-result.txt
            adb logcat -d -v threadtime > work/startup-logcat.txt 2>&1
            exit 1
          fi
          adb logcat -c
          adb shell monkey -p com.zallrwv4.app 1
          sleep 8
          adb shell pidof com.zallrwv4.app > work/app-pid-initial.txt 2>&1
          pid_rc=$?
          initial_pid=$(tr -d '\r\n' < work/app-pid-initial.txt)
          if [ "$pid_rc" -ne 0 ] || [ -z "$initial_pid" ]; then
            echo "APP_PID_MISSING_AFTER_LAUNCH" > work/emulator-result.txt
            adb logcat -d -v threadtime > work/startup-logcat.txt 2>&1
            grep -E -i 'FATAL EXCEPTION|AndroidRuntime|Fatal signal|am_crash|Process .* has died|Killing .*com.zallrwv4.app|Unable to start activity|ClassNotFoundException|NoClassDefFoundError' work/startup-logcat.txt > work/crash-summary.txt || true
            adb shell dumpsys activity activities > work/activity-dump.txt 2>&1
            adb shell dumpsys activity services > work/service-dump.txt 2>&1
            exit 1
          fi
          checkpoint=18
          while [ "$checkpoint" -le 48 ]; do
            sleep 10
            adb shell pidof com.zallrwv4.app > work/app-pid-current.txt 2>&1
            current_pid=$(tr -d '\r\n' < work/app-pid-current.txt)
            if [ -z "$current_pid" ] || [ "$current_pid" != "$initial_pid" ]; then
              echo "APP_PROCESS_CHANGED_AT_SECONDS=$checkpoint initial=$initial_pid current=$current_pid" > work/emulator-result.txt
              adb logcat -d -v threadtime > work/startup-logcat.txt 2>&1
              grep -E -i 'FATAL EXCEPTION|AndroidRuntime|Fatal signal|am_crash|Process .* has died|Killing .*com.zallrwv4.app|Unable to start activity|ClassNotFoundException|NoClassDefFoundError' work/startup-logcat.txt > work/crash-summary.txt || true
              adb shell dumpsys activity activities > work/activity-dump.txt 2>&1
              adb shell dumpsys activity services > work/service-dump.txt 2>&1
              exit 1
            fi
            checkpoint=$((checkpoint + 10))
          done
          adb logcat -d -v threadtime > work/startup-logcat.txt 2>&1
          adb shell dumpsys activity activities > work/activity-dump.txt 2>&1
          adb shell dumpsys activity services > work/service-dump.txt 2>&1
          echo "EMULATOR_STARTUP=PASS: same process survived 48 seconds" > work/emulator-result.txt
          SMOKE
          chmod +x work/smoke-test.sh

      - name: Smoke-test signed APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash work/smoke-test.sh


      - name: Diagnose app exit call sites
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p work
          {
            echo "=== direct System/Runtime/process exit references ==="
            grep -R -n -B 15 -A 15 -E 'Ljava/lang/(System|Runtime);->(exit|halt)\\(I\\)V|Process;->killProcess|killProcess\\(I\\)V' "work/Zall RW_src"/smali* --include='*.smali' 2>/dev/null
            echo "=== Kotlin exitProcess and reflective exit references ==="
            grep -R -n -B 10 -A 10 -E 'exitProcess|java/lang/System|java/lang/Runtime|forName|Method;->invoke|System\\.exit|Runtime\\.getRuntime|killProcess' "work/Zall RW_src"/smali* --include='*.smali' 2>/dev/null
            echo "=== dex bytecode references to exit calls ==="
            mkdir -p work/dex
            unzip -oq work/ZallRW-PERMANENT.apk 'classes*.dex' -d work/dex
            DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump 2>/dev/null | sort | tail -1)"
            if [ -n "$DEXDUMP" ]; then
              for dex in work/dex/classes*.dex; do
                echo "--- $dex ---"
                "$DEXDUMP" -d "$dex" 2>/dev/null | grep -B 18 -A 18 -E 'Ljava/lang/(System|Runtime);->(exit|halt)|killProcess|exitProcess' || true
              done
            else
              echo "dexdump unavailable"
            fi
          } > work/exit-call-sites.txt
          test -s work/exit-call-sites.txt || echo "No exit-related call sites found" > work/exit-call-sites.txt

      - name: Upload rebuild test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-REBUILD-TEST-DIAGNOSTICS
          path: |
            work/build-result.txt
            work/ZallRW-permanent-unsigned.apk
            work/ZallRW-PERMANENT.apk
            work/signing-result.txt
            work/emulator-result.txt
            work/startup-logcat.txt
            work/app-pid-initial.txt
            work/app-pid-current.txt
            work/activity-dump.txt
            work/service-dump.txt
            work/exit-call-sites.txt
          if-no-files-found: warn
          retention-days: 7
