name: Build Zall RW APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source.part-*"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  rebuild-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl unzip python3-yaml

      - name: Install modern Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" -o /usr/local/bin/apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 18); do test -s "source.part-${i}"; done
          cat $(printf 'source.part-%02d ' $(seq 0 18)) > Zall_RW_src_patched.zip
          unzip -tq Zall_RW_src_patched.zip
          mkdir work
          unzip -q Zall_RW_src_patched.zip -d work

      - name: Inspect source and attempt rebuild
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Xmx10g -XX:MaxMetaspaceSize=1g"
        run: |
          set -euo pipefail
          cd "work/Zall RW_src"
          echo "=== runner memory ==="
          free -h
          echo "=== Java heap ==="
          java -XshowSettings:vm -version 2>&1 | grep -E 'Max. Heap|Picked up|openjdk version' || true
          echo "=== Apktool ==="
          apktool --version
          echo "=== largest Smali files ==="
          find smali smali_classes* -type f -name '*.smali' -printf '%s %p\\n' 2>/dev/null | sort -nr > ../largest-smali-files.txt
          head -20 ../largest-smali-files.txt
          echo "=== source counts ==="
          find smali smali_classes* -type f -name '*.smali' 2>/dev/null | wc -l
          python3 - <<'PY'
          import json, yaml
          from pathlib import Path
          src = json.loads(Path("apktool.json").read_text())
          pkg = src.get("PackageInfo", {})
          vi = src.get("VersionInfo", {})
          fw = src.get("UsesFramework", {})
          data = {
              "version": "2.9.3",
              "apkFileName": src.get("apkFileName", "Zall RW_src.apk"),
              "isFrameworkApk": False,
              "usesFramework": {"ids": fw.get("ids", [1])},
              "packageInfo": {
                  "forcedPackageId": format(int(pkg.get("forcedPackageId", "127")), "x"),
                  "renameManifestPackage": pkg.get("renameManifestPackage")
              },
              "versionInfo": {
                  "versionCode": str(vi.get("versionCode", "19")),
                  "versionName": str(vi.get("versionName", "5.5"))
              },
              "sharedLibrary": bool(src.get("sharedLibrary", False)),
              "sparseResources": bool(src.get("sparseResources", False)),
              "unknownFiles": src.get("unknownFiles", {}),
              "doNotCompress": src.get("doNotCompress", [])
          }
          Path("apktool.yml").write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True))
          print("apktool.yml generated")
          PY
          apktool b . -o ../ZallRW-rebuild-test-unsigned.apk
          test -s ../ZallRW-rebuild-test-unsigned.apk
          unzip -tq ../ZallRW-rebuild-test-unsigned.apk
          echo "APKTOOL_BUILD=PASS" | tee ../build-result.txt
          ls -lh ../ZallRW-rebuild-test-unsigned.apk

      - name: Upload rebuild test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-REBUILD-TEST-DIAGNOSTICS
          path: |
            work/build-result.txt
            work/ZallRW-rebuild-test-unsigned.apk
            work/largest-smali-files.txt
          if-no-files-found: warn
          retention-days: 7
